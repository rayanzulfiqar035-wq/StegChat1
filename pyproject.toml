[project]
name = "stegchat"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = [
    "argon2-cffi==25.1.0",
    "Flask==3.1.3",
    "Flask-Limiter==4.1.1",
    "Flask-Login==0.6.3",
    "Flask-SocketIO==5.7.2",
    "Flask-SQLAlchemy==3.1.1",
    "flask-talisman==1.1.0",
    "Flask-WTF==1.3.0",
    "psycopg[binary]==3.3.9",
    "python-dotenv==1.2.4",
    "simple-websocket==1.1.0",
]

[tool.vercel]
entrypoint = "wsgi:app"

[tool.vercel.scripts]
build = "python prepare_vercel.py"
