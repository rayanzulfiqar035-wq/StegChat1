{% macro icon(name, extra_class='') -%}
<svg class="ui-icon {{ extra_class }}" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="{{ url_for('static', filename='images/icons.svg') }}#{{ name }}"></use></svg>
{%- endmacro %}
